name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach the APK to a GitHub Release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test the PDF writer
        run: npm test

      - name: Use the CI run number as versionCode (so each build installs over the last)
        run: |
          jq '.expo.android.versionCode = ${{ github.run_number }}' app.json > app.tmp.json
          mv app.tmp.json app.json

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Restore signing key (only if the secret is set)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/docvault-release.jks"
          echo "DOCVAULT_KEYSTORE_FILE=$RUNNER_TEMP/docvault-release.jks" >> "$GITHUB_ENV"
          echo "DOCVAULT_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DOCVAULT_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DOCVAULT_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/DocVault-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DocVault-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Read the app version
        id: version
        run: echo "version=$(jq -r .expo.version app.json)" >> "$GITHUB_OUTPUT"

      # Version tags (v1.5.0) publish under their own tag; every main build gets a build-N tag.
      # Tags created here use GITHUB_TOKEN, so they don't start another run of this workflow.
      - name: Publish the APK as a GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: DocVault ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
          fail_on_unmatched_files: true
